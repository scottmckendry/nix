name: Build

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 12:00 UTC: resolve latest flake inputs and build that result.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      update:
        description: Run nix flake update before building
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [eris]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: scottmckendry
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        if: github.event_name == 'schedule' || inputs.update
        run: nix flake update --print-build-logs

      - name: Pre-fetch DisplayLink zip (eris only)
        if: matrix.host == 'eris'
        run: |
          eval "$(nix eval --impure --raw --file utils/displaylink-info.nix)"
          nix-prefetch-url --name "$name" "$url"

      - name: Build ${{ matrix.host }}
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
            --no-link \
            --print-build-logs
