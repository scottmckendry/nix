name: Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: scottmckendry
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        run: nix flake update --print-build-logs

      - name: Check what needs warming
        id: plan
        run: |
          top=$(nix eval --raw \
            .#nixosConfigurations.eris.config.system.build.toplevel.outPath)
          echo "toplevel: $top"
          if nix path-info --store https://scottmckendry.cachix.org "$top" >/dev/null 2>&1; then
            echo 'Already in Cachix; nothing to push.'
          else
            echo 'warm=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-fetch DisplayLink zip
        if: steps.plan.outputs.warm == 'true'
        run: |
          eval "$(nix eval --impure --raw --file utils/displaylink-info.nix)"
          nix-prefetch-url --name "$name" "$url"

      - name: Build eris
        if: steps.plan.outputs.warm == 'true'
        run: |
          nix build .#nixosConfigurations.eris.config.system.build.toplevel \
            --no-link \
            --print-build-logs
